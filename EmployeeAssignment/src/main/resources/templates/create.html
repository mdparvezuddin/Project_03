<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Create Employee</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background:#f5f5f5;

}

.card{

margin-top:60px;

border-radius:15px;

box-shadow:0 0 20px rgba(0,0,0,0.15);

}

.card-header{

background:#198754;

color:white;

font-size:28px;

font-weight:bold;

text-align:center;

}

</style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card">

<div class="card-header">

Create Employee

</div>

<div class="card-body">

<form
th:action="@{/saveEmployee}"
th:object="${employee}"
method="post">

<div class="mb-3">

<label class="form-label">

Employee Name

</label>

<input
type="text"
class="form-control"
th:field="*{name}"
placeholder="Enter Employee Name">

<div
class="text-danger"
th:errors="*{name}">
</div>

</div>

<div class="mb-3">

<label class="form-label">

Age

</label>

<input
type="number"
class="form-control"
th:field="*{age}"
placeholder="Enter Age">

<div
class="text-danger"
th:errors="*{age}">
</div>

</div>

<div class="mb-3">

<label class="form-label">

Designation

</label>

<select
class="form-select"
th:field="*{designation}">

<option value="">Select Designation</option>

<option value="PROGRAMMER">

PROGRAMMER

</option>

<option value="MANAGER">

MANAGER

</option>

<option value="TESTER">

TESTER

</option>

</select>

<div
class="text-danger"
th:errors="*{designation}">
</div>

</div>

<div class="mb-3">

<label class="form-label">

Salary

</label>

<input
type="number"
class="form-control"
th:field="*{salary}"
placeholder="Enter Salary">

<div
class="text-danger"
th:errors="*{salary}">
</div>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-success">

Save Employee

</button>

</div>

<br>

<div class="text-center">

<a
href="/"
class="btn btn-secondary">

Back To Home

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
