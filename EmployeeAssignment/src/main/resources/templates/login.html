<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f5f5;
}

.card{
    margin-top:90px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}

.card-header{
    background:#198754;
    color:white;
    text-align:center;
    font-size:26px;
    font-weight:bold;
}

a{
    color:#198754;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}
</style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card">

                <div class="card-header">
                    Login
                </div>

                <div class="card-body">

                    <p th:if="${error}"
                       th:text="${error}"
                       class="text-danger text-center fw-bold">
                    </p>

                    <p th:if="${success}"
                       th:text="${success}"
                       class="text-success text-center fw-bold">
                    </p>

                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Username</label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter username"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                                required>
                        </div>

                        <div class="d-grid">
                            <button
                                type="submit"
                                class="btn btn-success">
                                Login
                            </button>
                        </div>

                    </form>

                    <div class="text-center mt-3">
                        <a href="/registerPage">
                            Create New Account
                        </a>
                    </div>

                    <div class="text-center mt-2">
                        <a href="/forgotPasswordPage">
                            Forgot Password?
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
