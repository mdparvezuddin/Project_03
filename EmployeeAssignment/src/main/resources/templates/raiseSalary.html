<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Raise Salary</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f5f5f5;
}

.card{
    margin-top:60px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
}

.card-header{
    background:#198754;
    color:white;
    font-size:28px;
    text-align:center;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card">

<div class="card-header">

Raise Employee Salary

</div>

<div class="card-body">

<p
th:if="${error}"
th:text="${error}"
class="text-danger fw-bold">
</p>

<form th:action="@{/updateSalary}" method="post">

<div class="mb-3">

<label class="form-label">

Select Employee

</label>

<select
id="employee"
name="name"
class="form-select"
required>

<option value="">-- Select Employee --</option>

<option
th:each="emp : ${employees}"
th:value="${emp.name}"
th:text="${emp.name}"
th:attr="data-salary=${emp.salary}">
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Current Salary

</label>

<input
type="text"
id="currentSalary"
class="form-control"
readonly>

</div>

<div class="mb-3">

<label class="form-label">

Increase Percentage (1-10%)

</label>

<input
type="number"
id="percentage"
name="percentage"
class="form-control"
min="1"
max="10"
required>

</div>

<div class="mb-3">

<label class="form-label">

New Salary

</label>

<input
type="text"
id="newSalary"
class="form-control"
readonly>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-success">

Update Salary

</button>

</div>

</form>

<div class="text-center mt-3">

<a
href="/"
class="btn btn-secondary">

Back To Home

</a>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

const employee = document.getElementById("employee");
const percentage = document.getElementById("percentage");
const currentSalary = document.getElementById("currentSalary");
const newSalary = document.getElementById("newSalary");

function calculate() {

    let option = employee.options[employee.selectedIndex];

    let salary = parseFloat(option.getAttribute("data-salary")) || 0;

    currentSalary.value = salary.toFixed(2);

    let p = parseFloat(percentage.value) || 0;

    let updatedSalary = salary + (salary * p / 100);

    newSalary.value = updatedSalary.toFixed(2);

}

employee.addEventListener("change", calculate);

percentage.addEventListener("input", calculate);

</script>

</body>

</html>
