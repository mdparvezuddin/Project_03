<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{ background:#f5f5f5; }
.card{
    margin-top:70px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}
.card-header{
    background:#198754;
    color:white;
    text-align:center;
    font-size:26px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<div class="row justify-content-center">
<div class="col-md-5">

<div class="card">
<div class="card-header">Reset Password</div>

<div class="card-body">

<p th:if="${error}" th:text="${error}" class="text-danger text-center fw-bold"></p>
<p th:if="${success}" th:text="${success}" class="text-success text-center fw-bold"></p>

<form th:action="@{/resetPassword}" method="post">

<input type="hidden" name="username" th:value="${username}">

<div class="mb-3">
<label class="form-label">Security Question</label>
<input type="text" class="form-control" th:value="${question}" readonly>
</div>

<div class="mb-3">
<label class="form-label">Security Answer</label>
<input type="text" name="securityAnswer" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">New Password</label>
<input type="password" name="newPassword" class="form-control" required>
</div>

<div class="d-grid">
<button type="submit" class="btn btn-success">Reset Password</button>
</div>

</form>

<div class="text-center mt-3">
<a href="/">Back to Login</a>
</div>

</div>
</div>

</div>
</div>
</div>

</body>
</html>
