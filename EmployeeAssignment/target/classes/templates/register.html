<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Create Account</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{ background:#f5f5f5; }
.card{
    margin-top:70px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}
.card-header{
    background:#198754;
    color:white;
    text-align:center;
    font-size:26px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<div class="row justify-content-center">
<div class="col-md-5">

<div class="card">
<div class="card-header">Create Account</div>

<div class="card-body">

<p th:if="${error}" th:text="${error}" class="text-danger text-center fw-bold"></p>
<p th:if="${success}" th:text="${success}" class="text-success text-center fw-bold"></p>

<form th:action="@{/register}" method="post">

<div class="mb-3">
<label class="form-label">Username</label>
<input type="text" name="username" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" name="password" class="form-control" required>
</div>

<div class="mb-3">
<label class="form-label">Security Question</label>
<select name="securityQuestion" class="form-select" required>
<option value="">Select Question</option>
<option value="pet">What is your pet name?</option>
<option value="school">What is your school name?</option>
<option value="city">What is your birth city?</option>
</select>
</div>

<div class="mb-3">
<label class="form-label">Security Answer</label>
<input type="text" name="securityAnswer" class="form-control" required>
</div>

<div class="d-grid">
<button type="submit" class="btn btn-success">Register</button>
</div>

</form>

<div class="text-center mt-3">
<a href="/">Already have an account? Login</a>
</div>

</div>
</div>

</div>
</div>
</div>

</body>
</html>
